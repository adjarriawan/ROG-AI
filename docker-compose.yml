services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic-rag-ai-db
    environment:
      POSTGRES_DB: agentic_rag
      POSTGRES_USER: postgres
      # Credentials come from .env (gitignored); no literal secret in this file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      RAG_READONLY_PASSWORD: ${RAG_READONLY_PASSWORD:?set RAG_READONLY_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 01-init.sh runs first and feeds init.sql the read-only password from env.
      - ./backend/sql/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic_rag"]
      interval: 5s
      retries: 10

volumes:
  postgres_data:
